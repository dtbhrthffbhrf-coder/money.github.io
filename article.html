<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="MoneyWise — อ่านความรู้ทางการเงิน"
    >

    <title>
        MoneyWise | บทความ
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-mark">
                    ฿
                </span>

                <span
                    class="logo-text"
                    data-website-name
                >
                    MoneyWise
                </span>

            </a>


            <nav class="main-nav">

                <a
                    href="index.html#articles"
                    class="nav-link"
                >
                    บทความ
                </a>

                <a
                    href="index.html#categories"
                    class="nav-link"
                >
                    หมวดหมู่
                </a>

                <a
                    href="index.html#about"
                    class="nav-link"
                >
                    เกี่ยวกับเรา
                </a>

            </nav>


            <a
                href="#"
                class="header-discord"
                data-discord
            >
                Discord
            </a>

        </div>

    </header>



    <!-- ARTICLE -->

    <main>

        <article class="article-page">

            <div class="container">


                <!-- BACK -->

                <a
                    href="index.html#articles"
                    class="article-back"
                >
                    ← กลับไปบทความ
                </a>


                <!-- ARTICLE HEADER -->

                <header
                    class="article-header"
                    id="articleHeader"
                >

                    <div class="article-loading">

                        กำลังโหลดบทความ...

                    </div>

                </header>


                <!-- TOP AD -->

                <div
                    class="ad-placeholder article-ad"
                    data-ad="article"
                >

                    <span class="ad-label">
                        Advertisement
                    </span>

                    <span
                        class="ad-text"
                        data-ad-text
                    >
                        พื้นที่โฆษณา
                    </span>

                </div>


                <!-- CONTENT -->

                <div
                    class="article-layout"
                    id="articleLayout"
                >

                    <div
                        class="article-content"
                        id="articleContent"
                    >
                    </div>


                    <aside
                        class="article-sidebar"
                    >

                        <div
                            class="ad-placeholder"
                            data-ad="bottom"
                        >

                            <span class="ad-label">
                                Advertisement
                            </span>

                            <span
                                class="ad-text"
                                data-ad-text
                            >
                                พื้นที่โฆษณา
                            </span>

                        </div>

                    </aside>

                </div>


            </div>

        </article>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-inner">

                <div class="footer-brand">

                    <a
                        href="index.html"
                        class="logo"
                    >

                        <span class="logo-mark">
                            ฿
                        </span>

                        <span
                            class="logo-text"
                            data-website-name
                        >
                            MoneyWise
                        </span>

                    </a>

                    <p>
                        ความรู้ทางการเงินที่เข้าใจง่าย
                    </p>

                </div>


                <div class="footer-links">

                    <a href="index.html#articles">
                        บทความ
                    </a>

                    <a href="index.html#categories">
                        หมวดหมู่
                    </a>

                    <a href="index.html#about">
                        เกี่ยวกับเรา
                    </a>

                    <a
                        href="#"
                        data-discord
                    >
                        Discord
                    </a>

                </div>

            </div>


            <div class="footer-bottom">

                <span>
                    © 2026 MoneyWise
                </span>

                <span>
                    Knowledge for better financial decisions.
                </span>

            </div>

        </div>

    </footer>



    <!-- SETTINGS -->

    <script src="config/settings.js"></script>


    <!-- ARTICLE SCRIPT -->

    <script src="js/article.js"></script>


</body>

</html>
